<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación — Curso Intermedio IA</title>
  <style>
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes optionIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulseFeedback {
      0% { transform: scale(0.97); opacity: 0; }
      60% { transform: scale(1.01); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes drawCircle {
      from { stroke-dashoffset: 314; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #f2f4f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      background: white;
      border-radius: 4px;
      padding: 2.5rem;
      max-width: 660px;
      width: 100%;
      border-top: 4px solid #028A0F;
      box-shadow: 0 1px 8px rgba(0,0,0,0.07);
    }

    .header {
      border-bottom: 1px solid #e8e8e8;
      padding-bottom: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .header-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #028A0F;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 17px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }
    .header p { font-size: 13px; color: #888; }

    .progress-bg {
      height: 3px;
      background: #e8e8e8;
      border-radius: 2px;
      margin-bottom: 1.75rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 3px;
      background: #028A0F;
      border-radius: 2px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    .q-wrap { animation: fadeSlideIn 0.35s ease both; }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .q-counter { font-size: 12px; color: #999; }
    .q-badge {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 2px;
      background: #f0f7f0;
      color: #028A0F;
      border: 1px solid #c8e6c9;
      font-weight: 500;
    }

    .q-text {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .options { display: flex; flex-direction: column; gap: 8px; }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      background: white;
      border: 1px solid #dde0dd;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      font-size: 13.5px;
      color: #2a2a2a;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
      opacity: 0;
    }
    .option-btn.visible { animation: optionIn 0.25s ease both; opacity: 1; }
    .option-btn:hover:not(:disabled) { border-color: #028A0F; background: #f5fbf5; }
    .option-btn.selected-correct { border-color: #028A0F; background: #f0f9f0; color: #015a08; }
    .option-btn.selected-wrong { border-color: #c0392b; background: #fdf2f2; color: #7b2020; }
    .option-btn.reveal-correct { border-color: #028A0F; background: #f0f9f0; color: #015a08; }
    .option-btn:disabled { cursor: default; }

    .option-letter {
      width: 26px;
      height: 26px;
      border-radius: 2px;
      background: #f4f4f4;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      color: #555;
      letter-spacing: 0;
    }

    .feedback-box {
      margin-top: 1rem;
      padding: 13px 16px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.6;
      animation: pulseFeedback 0.3s ease both;
    }
    .feedback-correct { background: #f0f9f0; color: #015a08; border-left: 3px solid #028A0F; }
    .feedback-wrong { background: #fdf2f2; color: #7b2020; border-left: 3px solid #c0392b; }

    .nav-row { display: flex; justify-content: flex-end; margin-top: 1.75rem; }
    .btn-next {
      padding: 10px 28px;
      background: #028A0F;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-next:hover { background: #026b0b; }
    .btn-next:active { transform: scale(0.98); }
    .btn-next:disabled { opacity: 0.35; cursor: default; }

    .results-wrap {
      text-align: center;
      padding: 1rem 0;
      animation: fadeIn 0.4s ease both;
    }

    .score-svg-wrap { margin: 0 auto 1.5rem; width: 110px; height: 110px; position: relative; }
    .score-svg-wrap svg { transform: rotate(-90deg); }
    .score-svg-wrap circle.track { fill: none; stroke: #e8e8e8; stroke-width: 6; }
    .score-svg-wrap circle.fill {
      fill: none;
      stroke: #028A0F;
      stroke-width: 6;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      stroke-linecap: round;
      animation: drawCircle 1.2s cubic-bezier(0.4,0,0.2,1) 0.2s both;
    }
    .score-inner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .score-num { font-size: 28px; font-weight: 600; color: #028A0F; line-height: 1; }
    .score-den { font-size: 11px; color: #999; margin-top: 2px; }

    .score-label { font-size: 17px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .score-sub { font-size: 13px; color: #666; margin-bottom: 1.75rem; line-height: 1.5; }

    .score-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 1.75rem;
    }
    .score-tier {
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 2px;
      border: 1px solid #e0e0e0;
      color: #aaa;
    }
    .score-tier.active {
      background: #f0f9f0;
      border-color: #028A0F;
      color: #028A0F;
      font-weight: 600;
    }

    .btn-retry {
      padding: 10px 28px;
      background: white;
      color: #028A0F;
      border: 1px solid #028A0F;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-retry:hover { background: #f0f9f0; }

    .review-list { text-align: left; margin-top: 2rem; display: flex; flex-direction: column; gap: 8px; }
    .review-title {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #999;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .review-item {
      padding: 12px 14px;
      border-radius: 3px;
      font-size: 13px;
      border: 1px solid #e8e8e8;
      background: white;
    }
    .review-item .rq { font-weight: 500; margin-bottom: 4px; color: #1a1a1a; }
    .review-item .ra { color: #015a08; font-size: 12px; }
    .review-item .rw { color: #7b2020; font-size: 12px; }
    .review-item.correct-r { border-left: 3px solid #028A0F; }
    .review-item.wrong-r { border-left: 3px solid #c0392b; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-label">Evaluación de conocimientos</div>
    <h1>Herramientas de IA Generativa — Nivel Intermedio</h1>
    <p>15 preguntas · Seleccione la respuesta que considere correcta</p>
  </div>
  <div id="quiz-area"></div>
</div>

<script>
const questions = [
  {
    type: "Reconocimiento",
    text: "¿Qué herramienta utilizaría para convertir un texto en video cinematográfico?",
    options: ["ElevenLabs", "Higgsfield AI", "n8n", "Dify"],
    correct: 1,
    explanation: "Higgsfield AI convierte texto e imagen en video cinematográfico de alta calidad. Es la herramienta indicada para videos de producto y contenido de marketing."
  },
  {
    type: "Reconocimiento",
    text: "¿Cuántas capas tiene la fórmula de prompts de Higgsfield AI?",
    options: ["2 capas", "4 capas", "3 capas", "5 capas"],
    correct: 2,
    explanation: "La fórmula tiene 3 capas: Capa 1 (imagen fuente), Capa 2 (identidad del sujeto) y Capa 3 (movimiento y estética)."
  },
  {
    type: "Reconocimiento",
    text: "¿Qué permite la función 'Artifacts' en Claude.ai?",
    options: ["Guardar el historial de conversaciones", "Crear código, documentos HTML y visualizaciones descargables", "Buscar información en internet en tiempo real", "Conectar Claude con otras aplicaciones"],
    correct: 1,
    explanation: "Artifacts permite a Claude generar código, documentos HTML y visualizaciones que se pueden previsualizar y descargar directamente desde la interfaz."
  },
  {
    type: "Comprensión",
    text: "¿Cuál de estas herramientas pertenece a la categoría 'Automatización' en el ecosistema IA 2026?",
    options: ["Midjourney", "ElevenLabs", "n8n", "Dify"],
    correct: 2,
    explanation: "n8n es una herramienta de automatización de flujos. Midjourney genera imágenes, ElevenLabs genera voz y Dify crea agentes IA."
  },
  {
    type: "Comprensión",
    text: "¿Para qué sirve principalmente ElevenLabs?",
    options: ["Crear videos con movimiento de cámara", "Automatizar flujos entre aplicaciones", "Generar y clonar voces con IA", "Construir agentes de ventas"],
    correct: 2,
    explanation: "ElevenLabs es la plataforma líder en generación y clonación de voz con inteligencia artificial."
  },
  {
    type: "Comprensión",
    text: "En un flujo completo de campaña de marketing, ¿qué herramienta agrega la voz en off al video?",
    options: ["Antigravity", "Dify", "n8n", "ElevenLabs"],
    correct: 3,
    explanation: "ElevenLabs convierte el texto en voz profesional para agregar la narración al video generado por Higgsfield AI."
  },
  {
    type: "Comprensión",
    text: "¿Qué función tiene 'Projects' en Claude.ai?",
    options: ["Genera imágenes con IA", "Crea carpetas con memoria para mantener contexto entre conversaciones", "Busca en internet en tiempo real", "Traduce documentos automáticamente"],
    correct: 1,
    explanation: "Projects son carpetas con memoria persistente. Claude recuerda el contexto de todas las conversaciones dentro de un mismo proyecto."
  },
  {
    type: "Comprensión",
    text: "En la técnica Chain of Thought, ¿qué se le solicita a Claude?",
    options: ["Que responda en menos de 50 palabras", "Que use ejemplos antes de responder", "Que piense paso a paso antes de responder", "Que asuma un rol específico"],
    correct: 2,
    explanation: "Chain of Thought consiste en indicarle a Claude 'Piensa paso a paso antes de responder.' Es ideal para análisis de decisiones y problemas complejos."
  },
  {
    type: "Comprensión",
    text: "¿Cuál es la estructura correcta de la 'Anatomía de un prompt perfecto'?",
    options: ["Rol, Tarea, Ejemplos, Resultado", "Rol, Contexto, Tarea, Formato, Restricción", "Contexto, Herramienta, Tono, Longitud", "Objetivo, Audiencia, Formato, Tiempo"],
    correct: 1,
    explanation: "Las 5 partes son: Rol → Contexto → Tarea → Formato → Restricción. Esta estructura garantiza respuestas precisas y accionables."
  },
  {
    type: "Comprensión",
    text: "En Higgsfield AI, ¿qué describe la Capa 2 de la fórmula de 3 capas?",
    options: ["El movimiento de la cámara", "La iluminación y estética del video", "La identidad del sujeto principal", "La resolución mínima del archivo"],
    correct: 2,
    explanation: "Capa 2 = Identidad del sujeto. Se describe quién o qué es el protagonista: material, acabado, apariencia, contexto."
  },
  {
    type: "Comprensión",
    text: "¿Cuál es la diferencia principal entre n8n y Dify?",
    options: ["n8n crea videos, Dify crea audios", "n8n automatiza flujos entre aplicaciones, Dify crea agentes IA con conocimiento propio", "n8n requiere programación, Dify no", "Son la misma herramienta con distinta interfaz"],
    correct: 1,
    explanation: "n8n conecta aplicaciones y automatiza flujos de trabajo. Dify crea agentes IA entrenados con el conocimiento específico de su empresa."
  },
  {
    type: "Aplicación",
    text: "Su cliente necesita un video de su producto rotando con luz cinematográfica para Instagram. ¿Qué herramienta recomienda?",
    options: ["ElevenLabs", "Higgsfield AI", "Dify", "Antigravity"],
    correct: 1,
    explanation: "Higgsfield AI genera videos cinematográficos de producto sin necesidad de cámara. Es la opción ideal para hero shots y contenido para redes sociales."
  },
  {
    type: "Aplicación",
    text: "Un restaurante necesita que al completar su formulario de contacto, el cliente reciba un correo automático y el dueño una notificación por WhatsApp. ¿Qué herramienta resuelve esto?",
    options: ["Claude.ai", "Dify", "n8n", "ElevenLabs"],
    correct: 2,
    explanation: "n8n automatiza este flujo exacto: formulario recibido → correo al cliente → notificación al dueño por WhatsApp. Sin código."
  },
  {
    type: "Aplicación",
    text: "Una clínica requiere un asistente disponible 24 horas que responda consultas frecuentes de pacientes, entrenado con sus propios documentos. ¿Qué herramienta es la indicada?",
    options: ["Higgsfield AI", "n8n", "Antigravity", "Dify"],
    correct: 3,
    explanation: "Dify permite crear agentes IA entrenados con los documentos y políticas propias de la clínica, disponibles las 24 horas sin necesidad de programar."
  },
  {
    type: "Aplicación",
    text: "Necesita una aplicación que reciba fotos de facturas por WhatsApp y registre los datos automáticamente en Google Sheets, sin conocimientos de programación. ¿Qué herramienta utiliza?",
    options: ["ElevenLabs", "Antigravity", "Suno AI", "Murf AI"],
    correct: 1,
    explanation: "Antigravity genera el código completo a partir de una descripción en lenguaje natural. Así se construyó FacturaBot: descripción del problema → aplicación funcional."
  }
];

let current = 0, score = 0, answered = false, userAnswers = [];

function render() {
  const area = document.getElementById('quiz-area');
  if (current >= questions.length) { renderResults(area); return; }
  const q = questions[current];
  const progress = (current / questions.length) * 100;
  const letters = ['A','B','C','D'];

  area.innerHTML = `
    <div class="progress-bg"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="q-wrap">
      <div class="q-meta">
        <span class="q-counter">Pregunta ${current + 1} de ${questions.length}</span>
        <span class="q-badge">${q.type}</span>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="selectAnswer(${i})" id="opt-${i}" style="animation-delay:${i*0.08}s">
            <span class="option-letter">${letters[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div id="feedback"></div>
      <div class="nav-row">
        <button class="btn-next" id="btn-next" disabled onclick="nextQuestion()">
          ${current === questions.length - 1 ? 'Ver resultado' : 'Continuar'} →
        </button>
      </div>
    </div>
  `;

  setTimeout(() => {
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
      setTimeout(() => btn.classList.add('visible'), i * 80);
    });
  }, 50);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const isCorrect = idx === q.correct;
  if (isCorrect) score++;
  userAnswers.push({ chosen: idx, correct: q.correct, isCorrect });
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === idx && isCorrect) btn.classList.add('selected-correct');
    if (i === idx && !isCorrect) btn.classList.add('selected-wrong');
    if (i === q.correct && !isCorrect) btn.classList.add('reveal-correct');
  });
  document.getElementById('feedback').innerHTML = `
    <div class="feedback-box ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}">
      <strong>${isCorrect ? 'Correcto.' : 'Incorrecto.'}</strong> ${q.explanation}
    </div>`;
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() { current++; answered = false; render(); }

function getLevel(s) {
  if (s >= 13) return { label: "Nivel Avanzado", sub: "Demuestra dominio sólido del ecosistema de herramientas IA.", tier: 2 };
  if (s >= 10) return { label: "Nivel Intermedio", sub: "Manejo adecuado de las herramientas. Se recomienda reforzar los temas con menor puntaje.", tier: 1 };
  return { label: "Reforzar Conocimientos", sub: "Se sugiere revisar los módulos correspondientes antes de continuar.", tier: 0 };
}

function renderResults(area) {
  const { label, sub, tier } = getLevel(score);
  const offset = 314 - (314 * score / questions.length);
  const tiers = ["Reforzar conocimientos", "Nivel Intermedio", "Nivel Avanzado"];

  area.innerHTML = `
    <div class="results-wrap">
      <div class="score-svg-wrap">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle class="track" cx="55" cy="55" r="50"/>
          <circle class="fill" cx="55" cy="55" r="50" style="stroke-dashoffset:${offset}"/>
        </svg>
        <div class="score-inner">
          <div class="score-num">${score}</div>
          <div class="score-den">de ${questions.length}</div>
        </div>
      </div>
      <div class="score-label">${label}</div>
      <div class="score-sub">${sub}</div>
      <div class="score-bar">
        ${tiers.map((t, i) => `<div class="score-tier ${i === tier ? 'active' : ''}">${t}</div>`).join('')}
      </div>
      <button class="btn-retry" onclick="restart()">Reintentar evaluación</button>
      <div class="review-list">
        <div class="review-title">Resumen de respuestas</div>
        ${userAnswers.map((a, i) => `
          <div class="review-item ${a.isCorrect ? 'correct-r' : 'wrong-r'}">
            <div class="rq">${i+1}. ${questions[i].text}</div>
            ${a.isCorrect
              ? `<div class="ra">✓ Respuesta correcta</div>`
              : `<div class="rw">✗ Seleccionó: ${questions[i].options[a.chosen]} — Correcta: ${questions[i].options[a.correct]}</div>`
            }
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function restart() { current = 0; score = 0; answered = false; userAnswers = []; render(); }
render();
</script>
</body>
</html>
